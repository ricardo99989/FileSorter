<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-mode="window">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: blob:; media-src 'self' file: blob:; font-src 'self'; frame-src 'self' file: blob:; object-src 'self' file:"
    />
    <title>FileSorter</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/glass.css" />
    <link rel="stylesheet" href="./styles/app.css" />
    <link rel="stylesheet" href="./styles/panels.css" />
    <!-- 材质层放最后：它要在前面几套之上重写玻璃的面、缘、投影与文字着色 -->
    <link rel="stylesheet" href="./styles/material.css" />
    <link rel="stylesheet" href="./styles/features.css" />
    <!-- 材质档位要在样式应用前定好，所以放在 head 末尾同步执行 -->
    <script src="./js/boot.js"></script>
  </head>
  <body>
    <div class="app-bg" aria-hidden="true"></div>
    <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

    <div class="app">
      <!-- 自绘标题栏：拖动区只覆盖这一条 -->
      <header class="titlebar">
        <div class="titlebar__brand">
          <img src="./assets/logo.png" alt="" id="brandLogo" />
          <span>FileSorter</span>
        </div>
        <span class="titlebar__meta" id="titleMeta">正在读取…</span>
        <div class="titlebar__spacer"></div>

        <!--
          紧凑模式（侧边栏 / 任务栏悬浮）会把 .sidebar 整块隐藏，而设置入口原本只在侧栏底部，
          于是切过去之后就再也点不回窗口模式了。这里在标题栏补一组紧凑控件：
          设置 + 一键回到窗口模式，两种紧凑模式下才显示。
        -->
        <div class="compactbar" id="compactBar">
          <button
            class="icon-btn"
            id="btnPlaces"
            type="button"
            title="切换位置 / 磁盘"
            aria-label="切换位置或磁盘"
            aria-haspopup="menu"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.6 7.4A1.8 1.8 0 0 1 5.4 5.6h4.1l1.7 2h7.4a1.8 1.8 0 0 1 1.8 1.8v7.2a1.8 1.8 0 0 1-1.8 1.8H5.4a1.8 1.8 0 0 1-1.8-1.8z" />
              <path d="M8.2 13.4h7.6" opacity=".55" />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="btnCompactSettings"
            type="button"
            title="设置 (Ctrl+,)"
            aria-label="设置"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z" />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="btnCompactExpand"
            type="button"
            title="回到窗口模式 (Ctrl+Shift+W)"
            aria-label="回到窗口模式"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.2" y="4.6" width="17.6" height="14.8" rx="2.4" />
              <path d="M3.2 9.2h17.6" opacity=".55" />
              <path d="M8.6 13.4l3.4-2.6 3.4 2.6" opacity=".9" />
            </svg>
          </button>
        </div>

        <div class="wincontrols">
          <button type="button" data-win="minimize" title="最小化" aria-label="最小化">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3">
              <path d="M2.5 6h7" />
            </svg>
          </button>
          <button type="button" data-win="maximize" title="最大化" aria-label="最大化">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3">
              <rect x="2.8" y="2.8" width="6.4" height="6.4" rx="1.2" />
            </svg>
          </button>
          <button type="button" data-win="close" title="关闭" aria-label="关闭">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3">
              <path d="M3 3l6 6M9 3l-6 6" />
            </svg>
          </button>
        </div>
      </header>

      <div class="body">
        <!-- 左栏：位置、工具 -->
        <aside class="sidebar glass" id="sidebar">
          <div class="side__scroll">
            <div class="side__label" data-i18n="nav.places">常用位置</div>
            <nav class="side__list" id="placeList" aria-label="常用位置"></nav>

            <div class="side__label" data-i18n="nav.tools">工具</div>
            <nav class="side__list" id="toolList" aria-label="工具">
              <button class="place" id="btnDupes" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="4" y="4" width="11" height="11" rx="2.4" />
                  <path d="M9 20h9a2 2 0 0 0 2-2V9" />
                </svg>
                <span data-i18n="nav.dupes">重复文件</span>
              </button>
              <button class="place" id="btnSpace" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3.6a8.4 8.4 0 1 0 8.4 8.4H12z" />
                  <path d="M12 3.6V12h8.4A8.4 8.4 0 0 0 12 3.6z" opacity=".45" />
                </svg>
                <span data-i18n="nav.space">空间分析</span>
              </button>
              <button class="place" id="btnBatch" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 8h16M4 16h16" />
                  <path d="M9.5 4v4M14.5 12v4" />
                </svg>
                <span data-i18n="nav.batch">批量重命名</span>
              </button>
              <button class="place" id="btnHistory" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3.6 12a8.4 8.4 0 1 0 2.4-5.9" />
                  <path d="M3.6 5.2V9h3.8" />
                  <path d="M12 8v4.4l3 1.8" />
                </svg>
                <span data-i18n="nav.history">操作历史</span>
              </button>
              <button class="place" id="btnTags" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 10.4V5.6A1.6 1.6 0 0 1 5.6 4h4.8c.42 0 .82.17 1.12.47l7.9 7.9a1.6 1.6 0 0 1 0 2.26l-5.74 5.74a1.6 1.6 0 0 1-2.26 0l-7.9-7.9A1.6 1.6 0 0 1 4 10.4z" />
                  <circle cx="8.6" cy="8.6" r="1.5" />
                </svg>
                <span data-i18n="nav.tags">标签</span>
              </button>
            </nav>

            <div class="side__label" data-i18n="nav.drives">此电脑</div>
            <nav class="side__list" id="driveList" aria-label="磁盘"></nav>
          </div>

          <div class="side__foot">
            <button class="side__action" id="btnOrganize" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7h10M4 12h16M4 17h7" />
                <path d="M17 5v4M15 7h4" />
              </svg>
              <span data-i18n="nav.organize">整理这个文件夹</span>
            </button>
            <button class="side__action" id="btnSettings" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z" />
              </svg>
              <span data-i18n="nav.settings">设置</span>
            </button>
          </div>
        </aside>

        <!-- 中栏 -->
        <main class="main glass">
          <div class="toolbar">
            <div class="navbtns">
              <button class="icon-btn" id="btnBack" type="button" title="后退 (Alt+←)" aria-label="后退">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M15 5l-7 7 7 7" />
                </svg>
              </button>
              <button class="icon-btn" id="btnForward" type="button" title="前进 (Alt+→)" aria-label="前进">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 5l7 7-7 7" />
                </svg>
              </button>
              <button class="icon-btn" id="btnUp" type="button" title="上一级 (Alt+↑)" aria-label="上一级">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 19V5M5 12l7-7 7 7" />
                </svg>
              </button>
              <button class="icon-btn" id="btnRefresh" type="button" title="刷新 (F5)" aria-label="刷新">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 11a8 8 0 1 0-2.6 6" />
                  <path d="M20 5v6h-6" />
                </svg>
              </button>
            </div>

            <nav class="crumbs" id="crumbs" aria-label="路径导航"></nav>

            <label class="field" id="searchField" title="在当前文件夹中筛选，回车可搜索子文件夹">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
                <circle cx="11" cy="11" r="6.4" />
                <path d="M16 16l4.2 4.2" />
              </svg>
              <input id="searchInput" type="text" placeholder="筛选或按回车搜索" autocomplete="off" spellcheck="false" />
            </label>

            <div class="segment" role="group" aria-label="视图切换">
              <button id="btnList" type="button" title="列表视图" aria-label="列表视图">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
                  <path d="M4 7h16M4 12h16M4 17h16" />
                </svg>
              </button>
              <button id="btnGrid" type="button" title="网格视图" aria-label="网格视图">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round">
                  <rect x="4" y="4" width="6.5" height="6.5" rx="1.6" />
                  <rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6" />
                  <rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6" />
                  <rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6" />
                </svg>
              </button>
            </div>

            <button class="icon-btn" id="btnTheme" type="button" title="切换主题" aria-label="切换主题"></button>
            <button class="icon-btn" id="btnDetail" type="button" title="显示/隐藏详情栏" aria-label="显示或隐藏详情栏">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="3" />
                <path d="M14.5 4v16" />
              </svg>
            </button>
          </div>

          <!-- 分类轮盘：扇区分段、悬停高亮、点击跳转/筛选 -->
          <section class="wheelbar glass" id="wheelBar" aria-label="分类轮盘">
            <div class="wheel" id="wheel"></div>
            <div class="wheel-legend" id="wheelLegend" role="group" aria-label="分类图例"></div>
            <button class="wheelbar__fold" id="btnWheelFold" type="button" title="收起分类轮盘" aria-label="收起或展开分类轮盘"></button>
          </section>

          <!--
            视图范围：全部 / 收藏 / 最近。
            放在列表正上方而不是工具栏：工具栏在 1360 宽下已经塞满（面包屑 + 搜索 + 视图 + 图标），
            再挤一组按钮会把面包屑压成省略号；这里独占一行 34px，两种视图下都在。
          -->
          <div class="scopebar">
            <div class="scope" id="scopeBar" role="group" aria-label="视图范围">
              <button type="button" data-scope="all" class="is-active" data-i18n="scope.all">全部</button>
              <button type="button" data-scope="fav" data-i18n="scope.fav">收藏</button>
              <button type="button" data-scope="recent" data-i18n="scope.recent">最近</button>
            </div>
            <span class="scopebar__hint" id="scopeHint"></span>
          </div>

          <div class="selectionbar" id="selectionBar" hidden>
            <span class="selectionbar__count" id="selectionCount"></span>
            <div class="selectionbar__spacer"></div>
            <button class="btn btn--sm" data-sel-act="move" type="button" data-i18n="sel.move">移动到…</button>
            <button class="btn btn--sm btn--danger" data-sel-act="delete" type="button" data-i18n="sel.delete">删除</button>
            <button class="btn btn--sm" data-sel-act="tag" type="button">打标签</button>
            <button class="btn btn--sm" data-sel-act="batch" type="button">重命名</button>
            <button class="btn btn--sm" data-sel-act="archive" type="button">打包</button>
            <button class="btn btn--sm" data-sel-act="exclude" type="button">排除</button>
            <button class="btn btn--sm btn--ghost" data-sel-act="clear" type="button">取消</button>
          </div>

          <div class="content" id="content">
            <div class="tablehead" id="tableHead"></div>
            <div class="viewport" id="viewport">
              <div class="vcontent" id="vcontent"></div>
            </div>
            <div class="state" id="state" hidden></div>
            <div class="skeleton-list" id="skeleton" hidden></div>
          </div>

          <footer class="statusbar" id="statusbar"></footer>
        </main>

        <!-- 右栏：详情 + 快速预览 -->
        <aside class="details glass" id="details"></aside>
      </div>
    </div>

    <div class="scrim" id="scrim"></div>
    <section class="drawer" id="drawer" aria-hidden="true"></section>
    <!--
      文件快速预览：双击卡片直接在这里看，不拉外部程序。
      图片走 <img>，文本走 peek 的纯文本，PDF 直接塞 iframe（Chromium 自带阅读器）。
      整块是浮层，玻璃材质和抽屉/菜单同一套。
    -->
    <div class="preview" id="preview" hidden aria-hidden="true">
      <div class="preview__scrim" data-preview-close></div>
      <section class="preview__panel glass" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
        <header class="preview__head">
          <div class="preview__meta">
            <div class="preview__title" id="previewTitle"></div>
            <div class="preview__sub" id="previewSub"></div>
          </div>
          <div class="preview__acts">
            <button class="btn btn--sm" id="previewOpen" type="button"></button>
            <button class="btn btn--sm btn--ghost" id="previewClose" type="button"></button>
          </div>
        </header>
        <div class="preview__body" id="previewBody"></div>
      </section>
    </div>

    <section class="modal" id="modal" aria-hidden="true"></section>
    <div class="menu" id="menu" hidden></div>

    <!--
      紧凑模式下的位置浮层：侧栏被隐藏后，常用位置和盘符的入口跟着一起没了，
      用户只能看到上一次停留的那一个盘。这个浮层是它们在 460×340 里的替代入口。
    -->
    <div class="placepop" id="placePop" hidden role="menu" aria-label="位置与磁盘"></div>
    <div class="toasts" id="toasts"></div>

    <!-- 折射滤镜：feDisplacementMap 拿 feTurbulence 当位移图，把背后的内容按噪声场拉扯。
         baseFrequency 压到 0.007/0.011 是为了让扭曲呈缓慢的有机波形 —— 频率一高就成毛玻璃噪点。
         scale 14px 是"能看出来但不影响读字"的上限，再大菜单文字会飘。
         只挂在浮动层上：它们下面压着文件卡片这类真实内容，位移才有东西可折。
         主面板不行 —— acrylic 档位下桌面是 DWM 画的，在页面之下，backdrop 采不到。 -->
    <svg class="fx-defs" aria-hidden="true" focusable="false">
      <defs>
        <filter
          id="liquidRefract"
          x="-12%"
          y="-12%"
          width="124%"
          height="124%"
          color-interpolation-filters="sRGB"
        >
          <feTurbulence type="fractalNoise" baseFrequency="0.007 0.011" numOctaves="2" seed="17" result="warp" />
          <feDisplacementMap
            in="SourceGraphic"
            in2="warp"
            scale="14"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
